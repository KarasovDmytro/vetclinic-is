        Задає назву, початковий залишок і (необов'язково) мінімальний поріг. Назва унікальна без
        урахування регістру. Доступ: ADMIN. Вимоги: REQ-F-040, REQ-F-043.
      x-requirements: [REQ-F-040, REQ-F-043]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationCreate'
            examples:
              valid:
                $ref: '#/components/examples/MedicationCreateRequestOk'
      responses:
        '201':
          description: Медикамент створено
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
              examples:
                success:
                  $ref: '#/components/examples/MedicationCreatedResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Конфлікт стану. Код `MEDICATION_NAME_TAKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                medicationNameTaken:
                  $ref: '#/components/examples/MedicationNameTakenError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Medications]
      operationId: listMedications
      summary: Каталог медикаментів
      description: |
        Сортування за `name`. Фільтр `lowStock=true` повертає препарати із залишком нижче порога.
        Доступ: ADMIN, VETERINARIAN (лікар лише обирає зі списку). Вимоги: REQ-F-044.
      x-requirements: [REQ-F-044]
      x-roles: [ADMIN, VETERINARIAN]
      parameters:
        - name: q
          in: query
          description: Підрядок у назві (без урахування регістру)
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: lowStock
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка медикаментів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationPage'
              examples:
                success:
                  $ref: '#/components/examples/MedicationPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /medications/{medicationId}:
    get:
      tags: [Medications]
      operationId: getMedication
      summary: Отримати медикамент
      description: "Доступ: ADMIN, VETERINARIAN. Вимоги: REQ-F-040."
      x-requirements: [REQ-F-040]
      x-roles: [ADMIN, VETERINARIAN]
      parameters:
        - $ref: '#/components/parameters/MedicationId'
      responses:
        '200':
          description: Медикамент
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Medications]
      operationId: updateMedication
      summary: Редагувати медикамент (назва, мінімальний поріг)
      description: |
        Залишок цією операцією не змінюється (поле `quantity` дає 422 `IMMUTABLE_FIELD`): він змінюється
        лише через `adjust-stock` і збереження прийомів. Доступ: ADMIN. Вимоги: REQ-F-041, REQ-F-043.
      x-requirements: [REQ-F-041, REQ-F-043]
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/MedicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationUpdate'
      responses:
        '200':
          description: Медикамент оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Конфлікт стану. Код `MEDICATION_NAME_TAKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                medicationNameTaken:
                  $ref: '#/components/examples/MedicationNameTakenError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /medications/{medicationId}/adjust-stock:
    post:
      tags: [Medications]
      operationId: adjustMedicationStock
      summary: Ручне коригування залишку
      description: |
        Змінює залишок на `delta` (додатне значення збільшує, від'ємне зменшує). Результат менший за 0
        відхиляється (409 `NEGATIVE_STOCK`). Сповіщення про низький залишок ця операція не створює.
        Доступ: ADMIN. Вимоги: REQ-F-042, REQ-F-048.
      x-requirements: [REQ-F-042, REQ-F-048]
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/MedicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustment'
            examples:
              valid:
                $ref: '#/components/examples/StockAdjustmentRequestOk'
      responses:
        '200':
          description: Залишок скориговано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
              examples:
                success:
                  $ref: '#/components/examples/StockAdjustedResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Конфлікт стану. Код `NEGATIVE_STOCK`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                negativeStock:
                  $ref: '#/components/examples/NegativeStockError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Сповіщення про низький залишок
      description: |
        Створюються автоматично під час збереження прийому, коли залишок став нижчим за поріг; для одного
        препарату не дублюються, поки існує непрочитане. Сортування за `createdAt` за спаданням.
        Доступ: ADMIN. Вимоги: REQ-F-047.
      x-requirements: [REQ-F-047]
      x-roles: [ADMIN]
      parameters:
        - name: read
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка сповіщень
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              examples:
                success:
                  $ref: '#/components/examples/NotificationsResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/{notificationId}/mark-read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Позначити сповіщення прочитаним
      description: "Ідемпотентна: повторний виклик повертає 200. Прапорець `read` спільний для всіх адміністраторів. Доступ: ADMIN. Вимоги: REQ-F-047."
      x-requirements: [REQ-F-047]
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Сповіщення позначено прочитаним
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Непрозорий токен доступу, виданий `POST /auth/login`. Клієнт не повинен розбирати його вміст.

  headers:
    Location:
      description: URI створеного ресурсу
      schema:
        type: string
    WWWAuthenticate:
      description: Схема автентифікації
      schema:
        type: string
        example: Bearer

  parameters:
    Page:
      name: page
      in: query
      description: Номер сторінки
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Розмір сторінки
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: q
      in: query
      description: Пошук за іменем, підрядок без урахування регістру (2–100 символів)
      schema:
        type: string
        minLength: 2
        maxLength: 100
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OwnerId:
      name: ownerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MedicationId:
      name: medicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Запит не вдалося розібрати (зламаний JSON, UUID чи дата не того формату). Код `MALFORMED_REQUEST`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformedRequest:
              $ref: '#/components/examples/MalformedRequestError'
    Unauthorized:
      description: Токена немає, він недійсний або прострочений (`UNAUTHORIZED`), або невірні дані входу (`INVALID_CREDENTIALS`).
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              $ref: '#/components/examples/UnauthorizedError'
            invalidCredentials:
              $ref: '#/components/examples/InvalidCredentialsError'
    Forbidden:
      description: Недостатньо прав. Коди `FORBIDDEN`, `ACCOUNT_DEACTIVATED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              $ref: '#/components/examples/ForbiddenError'
            accountDeactivated:
              $ref: '#/components/examples/AccountDeactivatedError'
    NotFound:
      description: Об'єкт із вказаним id не знайдено. Код `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/NotFoundError'
    UnsupportedMediaType:
      description: Тіло запиту не `application/json`. Код `UNSUPPORTED_MEDIA_TYPE`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupportedMediaType:
              $ref: '#/components/examples/UnsupportedMediaTypeError'
    ValidationError:
      description: Поля порушують правила. Код `VALIDATION_ERROR`, усі помилки в `details`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validationError:
              $ref: '#/components/examples/ValidationErrorExample'
    InternalError:
      description: Непередбачена помилка сервера. Код `INTERNAL_ERROR`; технічні деталі клієнту не віддаються.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalError:
              $ref: '#/components/examples/InternalServerError'

  examples:
    SlotTakenError:
      summary: Слот лікаря вже зайнятий (REQ-F-023)
      value:
        code: SLOT_TAKEN
        message: Слот вже зайнятий
        status: 409
        timestamp: '2026-10-20T13:58:41+03:00'
        path: /api/v1/appointments
        traceId: 7b1c4e0a-3f6d-4a52-9a1e-5c2d9f8e1b30
    InsufficientStockError:
      summary: Недостатній залишок медикамента (REQ-F-046)
      value:
        code: INSUFFICIENT_STOCK
        message: 'Недостатній залишок: Новокаїн (доступно: 5, запитано: 8)'
        status: 409
        timestamp: '2026-10-20T14:21:07+03:00'
        path: /api/v1/appointments/3f2a8c91-0d44-4be1-8f12-a77c5e0b9d63/visit
        traceId: c0d3f1a8-92b4-4d77-8a6e-1f4b7c2e9a55
        details:
          - field: medications[1].quantity
            reason: INSUFFICIENT_STOCK
            message: 'Недостатній залишок: Новокаїн (доступно: 5, запитано: 8)'
            params:
              medicationId: 9e1a6c24-5b7d-4f08-a3c1-2d8e0b4f7a96
              name: Новокаїн
              available: 5
              requested: 8
