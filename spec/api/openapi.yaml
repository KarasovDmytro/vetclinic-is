  /appointments/{appointmentId}/visit:
    post:
      tags: [Visits]
      operationId: createVisit
      summary: Зберегти результати прийому
      description: |
        Єдина атомарна транзакція (REQ-NF-005): створює прийом, ставить запису статус `COMPLETED`,
        зменшує залишки вказаних медикаментів і, якщо залишок став нижчим за поріг, створює
        сповіщення для адміністратора. Якщо кількість будь-якого препарату перевищує залишок,
        повертається 409 `INSUFFICIENT_STOCK` (у `details` кожен проблемний препарат), і не
        змінюється нічого: ні прийом, ні статус запису, ні залишки. Прийом може зберегти лише
        лікар, якому призначено запис, і лише для запису зі статусом `SCHEDULED` та неархівної
        картки. Доступ: VETERINARIAN. Вимоги: REQ-F-027, REQ-F-031, REQ-F-032, REQ-F-033,
        REQ-F-035, REQ-F-044, REQ-F-045, REQ-F-046, REQ-F-047, REQ-F-048, REQ-NF-005.
      x-requirements: [REQ-F-027, REQ-F-031, REQ-F-032, REQ-F-033, REQ-F-035, REQ-F-044, REQ-F-045, REQ-F-046, REQ-F-047, REQ-F-048, REQ-NF-005]
      x-roles: [VETERINARIAN]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitCreate'
            examples:
              valid:
                $ref: '#/components/examples/VisitCreateRequestOk'
      responses:
        '201':
          description: Прийом збережено, запис має статус `COMPLETED`
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
              examples:
                success:
                  $ref: '#/components/examples/VisitCreatedResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостатньо прав. Коди `FORBIDDEN` (роль адміністратора), `NOT_ASSIGNED_DOCTOR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
