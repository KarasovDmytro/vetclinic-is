  schemas:
    # ---------- Помилки ----------
    ErrorCode:
      type: string
      description: Стабільний машинозчитуваний код помилки
      enum:
        - MALFORMED_REQUEST
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - ACCOUNT_DEACTIVATED
        - NOT_ASSIGNED_DOCTOR
        - NOT_VISIT_AUTHOR
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - EMAIL_TAKEN
        - LAST_ADMIN
        - USER_ALREADY_DEACTIVATED
        - SLOT_TAKEN
        - APPOINTMENT_NOT_SCHEDULED
        - PATIENT_ARCHIVED
        - PATIENT_HAS_SCHEDULED_APPOINTMENTS
        - INSUFFICIENT_STOCK
        - NEGATIVE_STOCK
        - MEDICATION_NAME_TAKEN
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_ERROR
        - INTERNAL_ERROR
    ErrorDetailReason:
      type: string
      description: Причина помилки поля
      enum:
        - REQUIRED
        - INVALID_FORMAT
        - TOO_SHORT
        - TOO_LONG
        - OUT_OF_RANGE
        - INVALID_ENUM
        - UNKNOWN_FIELD
        - IMMUTABLE_FIELD
        - EMPTY_BODY
        - REFERENCE_NOT_FOUND
        - DOCTOR_NOT_AVAILABLE
        - SLOT_NOT_ALIGNED
        - OUTSIDE_WORKING_HOURS
        - INVALID_RANGE
        - RANGE_TOO_LARGE
        - DUPLICATE_MEDICATION
        - ZERO_DELTA
        - INSUFFICIENT_STOCK
    ErrorDetail:
      type: object
      required: [field, reason, message]
      properties:
        field:
          type: string
          nullable: true
          description: Шлях до поля запиту; `null`, якщо помилка не прив'язана до поля
          example: medications[1].quantity
        reason:
          $ref: '#/components/schemas/ErrorDetailReason'
        message:
          type: string
        params:
          type: object
          additionalProperties: true
          description: Додаткові значення (наприклад, `available`, `requested`)
    Error:
      type: object
      required: [code, message, status, timestamp, path, traceId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Повідомлення українською для показу користувачу
        status:
          type: integer
          description: Дублює HTTP-код стану
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        traceId:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    # ---------- Пагінація ----------
    PageInfo:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Загальна кількість елементів за фільтром
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    OwnerPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Owner'
    PatientPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Patient'
    AppointmentPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Appointment'
    VisitPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Visit'
    MedicationPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Medication'
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'

    # ---------- Перелічення ----------
    Role:
      type: string
      enum: [ADMIN, VETERINARIAN]
    PatientStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    Sex:
      type: string
      enum: [MALE, FEMALE, UNKNOWN]
    AppointmentStatus:
      type: string
      enum: [SCHEDULED, COMPLETED, CANCELLED]
    SlotStatus:
      type: string
      enum: [FREE, BOOKED]

    # ---------- Автентифікація та користувачі ----------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
    AuthUser:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Строк дії токена в секундах
          example: 28800
        user:
          $ref: '#/components/schemas/AuthUser'
    User:
      type: object
      required: [id, email, fullName, role, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, fullName, role, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Унікальний без урахування регістру; зберігається в нижньому регістрі
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: 8–72 символи і не більше 72 байтів UTF-8; у відповідях не повертається
    Doctor:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string

    # ---------- Власники та пацієнти ----------
    Owner:
      type: object
      required: [id, fullName, phone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OwnerCreate:
      type: object
      additionalProperties: false
      required: [fullName, phone]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
          description: Цифри без пробілів і дужок, необов'язковий початковий `+`
          example: '+380501234567'
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
        address:
          type: string
          minLength: 1
          maxLength: 300
          nullable: true
    OwnerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
        address:
          type: string
          minLength: 1
          maxLength: 300
          nullable: true
    Patient:
      type: object
      required: [id, ownerId, name, species, sex, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        sex:
          $ref: '#/components/schemas/Sex'
        birthDate:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/PatientStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PatientCreate:
      type: object
      additionalProperties: false
      required: [ownerId, name, species]
      properties:
        ownerId:
          type: string
          format: uuid
          description: Існуючий власник; після створення не змінюється
        name:
          type: string
          minLength: 1
          maxLength: 100
        species:
          type: string
          minLength: 1
          maxLength: 50
        breed:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        sex:
          allOf:
            - $ref: '#/components/schemas/Sex'
          default: UNKNOWN
        birthDate:
          type: string
          format: date
          nullable: true
          description: Не пізніше за поточну дату
    PatientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        species:
          type: string
          minLength: 1
          maxLength: 50
        breed:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        sex:
          $ref: '#/components/schemas/Sex'
        birthDate:
          type: string
          format: date
          nullable: true

    # ---------- Розклад і записи ----------
    Appointment:
      type: object
      required: [id, doctorId, patientId, startsAt, endsAt, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          example: '2026-10-20T14:00:00+03:00'
        endsAt:
          type: string
          format: date-time
          description: '`startsAt` + 30 хвилин'
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        visitId:
          type: string
          format: uuid
          nullable: true
          description: Ідентифікатор прийому; заповнюється після збереження результатів
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [doctorId, patientId, startsAt]
      properties:
        doctorId:
          type: string
          format: uuid
          description: Активний користувач з роллю `VETERINARIAN`
        patientId:
          type: string
          format: uuid
          description: Існуючий пацієнт зі статусом `ACTIVE`
        startsAt:
          type: string
          format: date-time
          description: |
            Початок слота: секунди дорівнюють 0, хвилини 0 або 30, у межах 09:00–17:30 за часом клініки.
          example: '2026-10-20T14:00:00+03:00'
    AppointmentUpdate:
      type: object
      additionalProperties: false
      required: [startsAt]
      properties:
        startsAt:
          type: string
          format: date-time
          description: Новий слот того самого лікаря (правила як у `AppointmentCreate.startsAt`)
    SlotAppointment:
      type: object
      nullable: true
      required: [id, patientId, patientName, status]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'
    Slot:
      type: object
      required: [startsAt, endsAt, status]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SlotStatus'
        appointment:
          allOf:
            - $ref: '#/components/schemas/SlotAppointment'
          type: object
          nullable: true
          description: Запис, що займає слот; `null` для вільного слота
    Schedule:
      type: object
      required: [doctorId, from, to, slotMinutes, slots]
      properties:
        doctorId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        slotMinutes:
          type: integer
          enum: [30]
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'

    # ---------- Прийоми ----------
    VisitMedication:
      type: object
      required: [medicationId, medicationName, quantity]
      properties:
        medicationId:
          type: string
          format: uuid
        medicationName:
          type: string
        quantity:
          type: integer
          minimum: 1
    Visit:
      type: object
      required: [id, appointmentId, patientId, doctorId, visitDate, diagnosis, medications, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        visitDate:
          type: string
          format: date-time
          description: Дорівнює `startsAt` запису, до якого належить прийом
        diagnosis:
          type: string
        prescriptions:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        medications:
          type: array
          items:
            $ref: '#/components/schemas/VisitMedication'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VisitMedicationInput:
      type: object
      additionalProperties: false
      required: [medicationId, quantity]
      properties:
        medicationId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
    VisitCreate:
      type: object
      additionalProperties: false
      required: [diagnosis]
      properties:
        diagnosis:
          type: string
          minLength: 1
          maxLength: 2000
        prescriptions:
          type: string
          minLength: 1
          maxLength: 4000
          nullable: true
        notes:
          type: string
          minLength: 1
          maxLength: 4000
          nullable: true
        medications:
          type: array
          maxItems: 50
          default: []
          description: Витрачені медикаменти; один препарат не повторюється
          items:
            $ref: '#/components/schemas/VisitMedicationInput'
    VisitUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        diagnosis:
          type: string
          minLength: 1
          maxLength: 2000
        prescriptions:
          type: string
          minLength: 1
          maxLength: 4000
          nullable: true
        notes:
          type: string
          minLength: 1
          maxLength: 4000
          nullable: true

    # ---------- Медикаменти та сповіщення ----------
    Medication:
      type: object
      required: [id, name, quantity, lowStock, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
          description: Поточний залишок
        minThreshold:
          type: integer
          minimum: 0
          nullable: true
          description: Мінімальний поріг; `null`, якщо не задано
        lowStock:
          type: boolean
          description: '`true`, якщо поріг заданий і залишок нижчий за нього'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MedicationCreate:
      type: object
      additionalProperties: false
      required: [name, quantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Унікальна без урахування регістру
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Початковий залишок
        minThreshold:
          type: integer
          minimum: 0
          maximum: 1000000
          nullable: true
    MedicationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        minThreshold:
          type: integer
          minimum: 0
          maximum: 1000000
          nullable: true
    StockAdjustment:
      type: object
      additionalProperties: false
      required: [delta]
      properties:
        delta:
          type: integer
          minimum: -1000000
          maximum: 1000000
          writeOnly: true
          description: |
            Зміна залишку: додатне значення збільшує, від'ємне зменшує. Не дорівнює 0.
            Результат має бути в межах 0–1 000 000.
          example: 5
    Notification:
      type: object
      required: [id, type, medicationId, medicationName, quantity, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [LOW_STOCK]
        medicationId:
          type: string
          format: uuid
        medicationName:
          type: string
        quantity:
          type: integer
          minimum: 0
          description: Залишок на момент створення сповіщення
        minThreshold:
          type: integer
          minimum: 0
          nullable: true
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
