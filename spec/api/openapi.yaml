openapi: 3.0.3

info:
  title: API інформаційної системи ветеринарної клініки
  version: 1.0.0
  description: |
    REST API для обліку власників і пацієнтів, ведення медичних карток, керування розкладом прийомів
    та обліку медикаментів ветеринарної клініки. Джерело вимог: `spec/srs.md` v1.0,
    `spec/addendum-001-api-decisions.md`, `spec/addendum-002-api-contract-decisions.md`.

    ## Загальні правила

    - **Формат.** JSON (`application/json`), поля в camelCase, ідентифікатори UUID, час за ISO 8601 із зсувом
      (відповіді повертаються в часовому поясі клініки `Europe/Kyiv`), дати без часу у форматі `YYYY-MM-DD`
      (трактуються в часовому поясі клініки, межі діапазонів `from` і `to` включно).
    - **Автентифікація.** Заголовок `Authorization: Bearer <token>`. Токен видається `POST /auth/login`
      (дійсний 8 годин). Активність облікового запису перевіряється на кожному запиті.
    - **Ролі.** `ADMIN` (адміністратор) і `VETERINARIAN` (лікар). Кожна операція вказує дозволені ролі
      в розширенні `x-roles`. Роль перевіряється на кожному ендпоінті (REQ-F-004, REQ-NF-002).
    - **Порядок перевірок.** 401, потім 403 (роль), потім 400/422, потім 404, потім 409. Винятки: 403
      `NOT_ASSIGNED_DOCTOR` і `NOT_VISIT_AUTHOR` визначаються після завантаження об'єкта.
    - **Пагінація колекцій.** Параметри `page` (≥ 1, за замовчуванням 1) і `pageSize` (1–100, за замовчуванням 20);
      відповідь має вигляд `{items, page, pageSize, total}`. Сортування фіксоване для кожної колекції.
    - **PATCH.** Передані поля змінюються, відсутні лишаються. Невідоме або незмінюване поле і порожнє тіло
      дають 422. Значення `null` очищає необов'язкове поле.
    - **Видалення.** Фізичного видалення сутностей предметної області немає: `DELETE` на будь-який ресурс
      повертає 405 із заголовком `Allow` (REQ-F-016). Деактивація, архівація та скасування виконуються
      зміною статусу.
    - **Помилки.** Єдина модель `Error` (див. компоненти) для всіх відповідей 4xx і 5xx. Кожна відповідь
      містить заголовок `X-Request-Id`, що збігається з `traceId` у тілі помилки; відповідь 405 містить
      заголовок `Allow` зі списком дозволених методів; відповідь 401 містить `WWW-Authenticate: Bearer`.
    - **Простежуваність.** Розширення `x-requirements` у кожній операції містить REQ-ID вимог SRS, які вона
      реалізує. Наскрізні вимоги REQ-F-004 і REQ-NF-002 (перевірка ролі на кожному ендпоінті, 401/403)
      діють для всіх операцій і наведені в `x-cross-cutting-requirements`.

    ## Відповідність термінам предметної області

    | Термін глосарію SRS §3 | У API |
    |---|---|
    | Власник (Owner) | ресурс `owners`, схема `Owner` |
    | Пацієнт (Patient) | ресурс `patients`, схема `Patient` |
    | Запис на прийом (Appointment) | ресурс `appointments`; статуси «Заплановано», «Завершено», «Скасовано» мають значення `SCHEDULED`, `COMPLETED`, `CANCELLED` |
    | Прийом (Visit) | схема `Visit`, підресурс запису `appointments/{appointmentId}/visit` |
    | Медична картка (Medical Record) | не окремий ресурс: хронологія прийомів `patients/{patientId}/visits` і статус пацієнта (`ACTIVE`, `ARCHIVED`, «Архівна картка») |
    | Слот розкладу (Schedule Slot) | схема `Slot` у відповіді `doctors/{doctorId}/schedule` (`FREE`, `BOOKED`) |
    | Конфлікт розкладу (Schedule Conflict) | відповідь 409 з кодом `SLOT_TAKEN` |
    | Медикамент (Medication), Каталог медикаментів | ресурс `medications`, схема `Medication` |
    | Залишок препарату (Medication Stock) | поле `quantity` медикамента, операція `adjust-stock` |
    | Адміністратор (Administrator) | роль `ADMIN` |
    | Лікар (Veterinarian) | роль `VETERINARIAN`; у шляхах і полях використано скорочення `doctor` (`/doctors`, `doctorId`) |
    | Сповіщення про низький залишок (REQ-F-047, поза глосарієм) | ресурс `notifications`, тип `LOW_STOCK` |

    ## Основні позитивні сценарії

    Приклади запитів і відповідей для основних операцій наведено в полях `examples` (запити: `valid`,
    відповіді: `success`) і пов'язані спільними даними: лікар Іваненко О.П., власниця Коваленко М.І.,
    пацієнт Барсик, препарати Амоксицилін і Новокаїн. Наскрізний сценарій:
    `login`, `createUser` (лікар), `createOwner`, `createPatient`, `getDoctorSchedule`, `createAppointment`,
    `rescheduleAppointment` або `cancelAppointment`, `createVisit` (списання медикаментів, BDD §9.2),
    `listPatientVisits`, `adjustMedicationStock`, `listNotifications`. Негативні сценарії описано
    відповідями 4xx кожної операції (код і приклад на кожну помилку).
  x-cross-cutting-requirements: [REQ-F-004, REQ-NF-002]

servers:
  - url: /api/v1
    description: Базовий шлях API (хост задається середовищем розгортання)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Автентифікація
  - name: Users
    description: Облікові записи користувачів
  - name: Owners
    description: Власники тварин
  - name: Patients
    description: Пацієнти (тварини) та архівування карток
  - name: Schedule
    description: Сітка розкладу лікаря
  - name: Appointments
    description: Записи на прийом
  - name: Visits
    description: Прийоми та медична картка
  - name: Medications
    description: Каталог медикаментів і залишки
  - name: Notifications
    description: Сповіщення адміністратора про низький залишок

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вхід у систему
      description: |
        Повертає bearer-токен. Невірні email або пароль дають 401 `INVALID_CREDENTIALS` (однаково для
        невідомого email). Якщо пароль вірний, а обліковий запис деактивовано, повертається 403
        `ACCOUNT_DEACTIVATED`. Вимоги: REQ-F-003, REQ-NF-001.
      x-requirements: [REQ-F-003, REQ-NF-001]
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valid:
                $ref: '#/components/examples/LoginRequestOk'
      responses:
        '200':
          description: Успішний вхід
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  $ref: '#/components/examples/LoginResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Створити обліковий запис
      description: |
        Створює користувача з роллю `ADMIN` або `VETERINARIAN`. Пароль задає адміністратор; у відповідях
        пароль не повертається, а зберігається лише у захищеному вигляді (REQ-NF-001). Доступ: ADMIN.
        Вимоги: REQ-F-001, REQ-F-005, REQ-NF-001.
      x-requirements: [REQ-F-001, REQ-F-005, REQ-NF-001]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            examples:
              valid:
                $ref: '#/components/examples/UserCreateRequestOk'
      responses:
        '201':
          description: Обліковий запис створено
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                success:
                  $ref: '#/components/examples/UserCreatedResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Конфлікт стану. Код `EMAIL_TAKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailTaken:
                  $ref: '#/components/examples/EmailTakenError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Users]
      operationId: listUsers
      summary: Список облікових записів
      description: "Сортування за `fullName`. Доступ: ADMIN. Вимоги: REQ-F-001, REQ-F-005."
      x-requirements: [REQ-F-001, REQ-F-005]
      x-roles: [ADMIN]
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка користувачів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Отримати обліковий запис
      description: "Доступ: ADMIN. Вимоги: REQ-F-001, REQ-F-005."
      x-requirements: [REQ-F-001, REQ-F-005]
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Користувач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}/deactivate:
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Деактивувати обліковий запис
      description: |
        Необоротна зміна: `active` стає `false`, токени користувача перестають діяти одразу,
        вхід заборонено. Фізичного видалення немає. Доступ: ADMIN. Вимоги: REQ-F-002, REQ-F-005.
      x-requirements: [REQ-F-002, REQ-F-005]
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Користувача деактивовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Конфлікт стану. Коди `LAST_ADMIN`, `USER_ALREADY_DEACTIVATED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                lastAdmin:
                  $ref: '#/components/examples/LastAdminError'
                userAlreadyDeactivated:
                  $ref: '#/components/examples/UserAlreadyDeactivatedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /doctors:
    get:
      tags: [Users]
      operationId: listDoctors
      summary: Довідник активних лікарів
      description: |
        Усі активні користувачі з роллю `VETERINARIAN` (без пагінації, сортування за `fullName`).
        Окремий від адміністративного списку користувачів. Доступ: ADMIN, VETERINARIAN.
        Вимоги: REQ-F-020, REQ-F-021.
      x-requirements: [REQ-F-020, REQ-F-021]
      x-roles: [ADMIN, VETERINARIAN]
      responses:
        '200':
          description: Список лікарів
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /owners:
    post:
      tags: [Owners]
      operationId: createOwner
      summary: Зареєструвати власника
      description: "Доступ: ADMIN. Вимоги: REQ-F-010."
      x-requirements: [REQ-F-010]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
            examples:
              valid:
                $ref: '#/components/examples/OwnerCreateRequestOk'
      responses:
        '201':
          description: Власника створено
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
              examples:
                success:
                  $ref: '#/components/examples/OwnerCreatedResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Owners]
      operationId: listOwners
      summary: Пошук і список власників
      description: |
        Параметр `q` (2–100 символів) шукає підрядок у `fullName` без урахування регістру.
        Сортування за `fullName`. Відповідь не повільніша за 3 с при 10 000 записів (REQ-NF-003).
        Доступ: ADMIN, VETERINARIAN (лише читання). Вимоги: REQ-F-017, REQ-NF-003.
      x-requirements: [REQ-F-017, REQ-NF-003]
      x-roles: [ADMIN, VETERINARIAN]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка власників
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /owners/{ownerId}:
    get:
      tags: [Owners]
      operationId: getOwner
      summary: Отримати власника
      description: "Доступ: ADMIN, VETERINARIAN. Вимоги: REQ-F-010."
      x-requirements: [REQ-F-010]
      x-roles: [ADMIN, VETERINARIAN]
      parameters:
        - $ref: '#/components/parameters/OwnerId'
      responses:
        '200':
          description: Власник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Owners]
      operationId: updateOwner
      summary: Редагувати власника
      description: "Доступ: ADMIN. Вимоги: REQ-F-011."
      x-requirements: [REQ-F-011]
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/OwnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
      responses:
        '200':
          description: Власника оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /patients:
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Зареєструвати пацієнта
      description: |
        Пацієнт прив'язується до рівно одного існуючого власника через `ownerId`; зміна власника
        після створення не передбачена. Початковий статус `ACTIVE` задає сервер.
        Доступ: ADMIN. Вимоги: REQ-F-012, REQ-F-014.
      x-requirements: [REQ-F-012, REQ-F-014]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
            examples:
              valid:
                $ref: '#/components/examples/PatientCreateRequestOk'
      responses:
        '201':
          description: Пацієнта створено
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                success:
                  $ref: '#/components/examples/PatientCreatedResponseOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Patients]
      operationId: listPatients
      summary: Пошук і список пацієнтів
      description: |
        Параметр `q` (2–100 символів) шукає підрядок у `name` пацієнта без урахування регістру.
        Сортування за `name`. Відповідь не повільніша за 3 с при 10 000 пацієнтів (REQ-NF-003).
        Доступ: ADMIN, VETERINARIAN (лише читання). Вимоги: REQ-F-017, REQ-NF-003.
      x-requirements: [REQ-F-017, REQ-NF-003]
      x-roles: [ADMIN, VETERINARIAN]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PatientStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка пацієнтів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /patients/{patientId}:
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Отримати пацієнта
      description: |
        Містить `status` (`ACTIVE`/`ARCHIVED`) картки. Не містить діагнозів чи призначень.
        Метод `DELETE` на цей ресурс повертає 405 (REQ-F-016). Доступ: ADMIN, VETERINARIAN.
        Вимоги: REQ-F-012, REQ-F-016.
      x-requirements: [REQ-F-012, REQ-F-016]
