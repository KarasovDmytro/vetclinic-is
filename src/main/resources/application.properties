spring.application.name=vet-clinic-api
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vetclinic}
spring.datasource.username=${DB_USER:vetclinic}
spring.datasource.password=${DB_PASSWORD:vetclinic}
vetclinic.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-before-production-0123456789}
vetclinic.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@clinic.example}
vetclinic.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
