name: vet-clinic

services:
  postgres:
    image: postgres:17
    container_name: vet-clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vetclinic}
      POSTGRES_USER: ${DB_USER:-vetclinic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetclinic}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
