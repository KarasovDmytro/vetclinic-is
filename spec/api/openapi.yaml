      description: |
        Статус `SCHEDULED` призначає сервер. Якщо слот лікаря вже зайнятий, повертається 409
        `SLOT_TAKEN`, і другий запис не зберігається. Для архівного пацієнта повертається 409
        `PATIENT_ARCHIVED`. Той самий слот для іншого лікаря створюється без конфлікту.
        Доступ: ADMIN. Вимоги: REQ-F-021, REQ-F-022, REQ-F-023.
