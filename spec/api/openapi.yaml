  /doctors/{doctorId}/schedule:
    get:
      tags: [Schedule]
      operationId: getDoctorSchedule
      summary: Сітка розкладу лікаря
      description: |
        Повертає всі слоти по 30 хвилин у межах робочих годин (09:00–18:00) за діапазон дат
        `from`…`to` включно (не більше 7 днів), вільні й зайняті. Слот зайнятий, якщо на нього є запис
        зі статусом `SCHEDULED` або `COMPLETED`; скасований запис слот звільняє. Тижневий розклад
        повертається не повільніше за 2 с (REQ-NF-004). Лікар має лише перегляд.
        Доступ: ADMIN, VETERINARIAN. Вимоги: REQ-F-020, REQ-F-026, REQ-NF-004.
      x-requirements: [REQ-F-020, REQ-F-026, REQ-NF-004]
      x-roles: [ADMIN, VETERINARIAN]
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Розклад лікаря
