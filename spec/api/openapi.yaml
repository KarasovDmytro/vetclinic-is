      summary: Помилка валідації
      value:
        code: VALIDATION_ERROR
        message: Дані запиту некоректні
        status: 422
        timestamp: '2026-10-20T13:50:12+03:00'
        path: /api/v1/appointments
        traceId: 2f9e6b7d-1c40-4d28-b5a3-8e0c4a7f6d19
        details:
          - field: startsAt
            reason: SLOT_NOT_ALIGNED
            message: Початок слота має бути на :00 або :30
          - field: doctorId
            reason: REFERENCE_NOT_FOUND
            message: Лікаря не знайдено

    MalformedRequestError:
      summary: Ідентифікатор у шляху не є UUID
      value:
        code: MALFORMED_REQUEST
